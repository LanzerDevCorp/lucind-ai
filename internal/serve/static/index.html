<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lucind-ai approvals</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .metrics {
      display: flex;
      gap: 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .metric-value {
      color: var(--text);
      font-weight: 600;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 1.5rem 0 0.75rem 0;
    }
    .command-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--accent);
      overflow-x: auto;
      margin-bottom: 2rem;
      user-select: all;
    }
    .approval-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .lane-id {
      font-weight: 600;
      font-family: var(--font-mono);
    }
    .packet-id {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .evidence-block {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0.75rem 0;
    }
    .no-evidence {
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.85rem;
      margin: 0.75rem 0;
    }
    .card-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      border-radius: 4px;
      border: none;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.15s;
    }
    button:hover {
      opacity: 0.9;
    }
    .btn-approve {
      background: var(--green);
      color: white;
    }
    .btn-reject {
      background: var(--red);
      color: white;
    }
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>lucind-ai approvals</h1>
      <div class="metrics">
        <div>Approver: <span id="approver-name" class="metric-value">-</span></div>
        <div>Wrong-Approval Rate: <span id="approver-rate" class="metric-value">0.0%</span></div>
      </div>
    </header>

    <div class="section-title">Merged Batch Review Command</div>
    <div id="opencode-cmd" class="command-box">opencode run --agent build -m openai/gpt-5.6-sol</div>

    <div class="section-title">Pending Approvals</div>
    <div id="approvals-container">
      <div class="empty-state">No pending approvals.</div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
