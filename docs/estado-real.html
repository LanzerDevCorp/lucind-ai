<head>

<style>

    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {

      --surface:   #161f26;
      --ink:       #dde6ea;
      --ink-soft:  #9aabb5;
      --ink-faint: #6c7f8a;

      --warn:      #d9963f;

  :root[data-theme="dark"] {

    --surface:   #161f26;
    --ink:       #dde6ea;
    --ink-soft:  #9aabb5;
    --ink-faint: #6c7f8a;
    --rule:      #2b3a44;
    --accent:    #46b5ac;
    --warn:      #d9963f;
    --ghost:     #5b6d78;

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);

    line-height: 1.6;
    margin: 0;

  .wrap { max-width: 1100px; margin: 0 auto; }

  header.page { padding: 56px 0 28px; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 16px;

  h1 {

    margin: 0 0 16px;
  }

  .lede {
    font-size: 18px;
    color: var(--ink-soft);
    line-height: 1.55;
    max-width: 64ch;
    margin: 0;
  }

  .fig-scroll { overflow-x: auto; }

  figure {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 26px 24px 20px;
  }

  figure svg { display: block; width: 100%; height: auto; min-width: 860px; }

  figcaption {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink-soft);

  <header class="page">
    <p class="eyebrow">Diseño nuevo · 17-ago-2026</p>
    <h1>lucind-ai</h1>
    <p class="lede">El control de flujo se va del hilo de Claude a un binario en Go, y la barrera
      es la pieza que sostiene todo. Sigue siendo un estado real: lo dibujado es el diseño acordado,
      y lo punteado todavía no existe.</p>

      <figcaption>La pieza que sostiene el diseño es la <span class="m">barrera</span>: los carriles
        corren en paralelo, pero nada se integra hasta que todos llegan a un estado terminal. Los que
        volvieron <span class="m">done</span> se mergean primero a un árbol combinado temporal y los
        tests corren ahí; si sale rojo se bisecta para aislar al culpable y los verdes entran igual.
        Un carril que falló no bloquea a uno que salió bien, pero nada se integra sin verificar el
        estado combinado. El otro cambio de fondo es que el control de flujo deja de vivir
        en este hilo y pasa a un binario: Claude Code baja de cinco roles a dos. Y lo honesto,
        que es para lo que existe este documento: de todo lo punteado no hay una sola línea
        escrita — ni el CLI, ni el ledger, ni la web, ni una corrida de <span class="m">RDD</span>.
        Lo único ejercitado sigue siendo un paquete de <span class="m">agy</span> y un paquete
        humano, los mismos de hace cuatro días. <span class="m">cursor-agent</span> se logueó hoy
        y todavía no ejecutó nada.</figcaption>
