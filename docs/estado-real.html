<title>lucind-ai</title>

<style>
  :root {
    --bg:        #eef1f3;
    --surface:   #ffffff;
    --ink:       #16202a;
    --ink-soft:  #55636e;
    --ink-faint: #8494a0;
    --rule:      #ccd6db;
    --accent:    #0d6c68;
    --warn:      #9c500b;
    --ghost:     #93a3ad;

    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #0e151a;
      --surface:   #161f26;
      --ink:       #dde6ea;
      --ink-soft:  #9aabb5;
      --ink-faint: #6c7f8a;
      --rule:      #2b3a44;
      --accent:    #46b5ac;
      --warn:      #d9963f;
      --ghost:     #5b6d78;
    }
  }

  :root[data-theme="dark"] {
    --bg:        #0e151a;
    --surface:   #161f26;
    --ink:       #dde6ea;
    --ink-soft:  #9aabb5;
    --ink-faint: #6c7f8a;
    --rule:      #2b3a44;
    --accent:    #46b5ac;
    --warn:      #d9963f;
    --ghost:     #5b6d78;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
    padding: 0 20px 72px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  header.page { padding: 56px 0 28px; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 16px;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(36px, 6vw, 56px);
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 16px;
  }

  .lede {
    font-size: 18px;
    color: var(--ink-soft);
    line-height: 1.55;
    max-width: 64ch;
    margin: 0;
  }

  .fig-scroll { overflow-x: auto; }

  figure {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 26px 24px 20px;
  }

  figure svg { display: block; width: 100%; height: auto; min-width: 780px; }

  figcaption {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid var(--rule);
    max-width: 80ch;
  }

  .m { font-family: var(--mono); font-size: 0.9em; }
</style>

<div class="wrap">

  <header class="page">
    <p class="eyebrow">Estado real · 13-ago-2026</p>
    <h1>lucind-ai</h1>
    <p class="lede">Lo que corre hoy, no lo que está diseñado. Un paquete mergeado, dos vías
      ejercitadas de cuatro, y un orquestador que todavía hace cinco trabajos.</p>
  </header>

  <div class="fig-scroll">

          <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ghost)"/>
          </marker>
        </defs>

                stroke-width="1.4" stroke-dasharray="5 4"/>

        <rect x="20" y="62" width="152" height="50" rx="3" fill="none"

        <text x="34" y="100" font-family="ui-monospace, Menlo, Consolas, monospace"

        <polyline points="172,87 289,87 289,104" fill="none" stroke="var(--ghost)"

        <line x1="138" y1="191" x2="176" y2="191" stroke="currentColor"

        <text x="289" y="148" text-anchor="middle"

          <text x="200" y="182">enruta y decide</text>
          <text x="200" y="200">escribe el paquete</text>
          <text x="200" y="218">despacha y cosecha</text>
          <text x="200" y="236">inspecciona el diff</text>
          <text x="200" y="254">arbitra y mergea</text>

        <text x="184" y="296" font-family="ui-monospace, Menlo, Consolas, monospace"

        <rect x="438" y="140" width="170" height="104" rx="3" fill="none"

        <!-- spine -->
        <line x1="636" y1="112" x2="636" y2="416" stroke="currentColor"

        <rect x="680" y="64" width="270" height="96" rx="3" fill="none"

        <!-- via auditoria: nunca corrio -->
        <rect x="680" y="210" width="270" height="72" rx="3" fill="none"

        <text x="694" y="236" font-family="system-ui, sans-serif" font-size="13.5"
              fill="var(--ghost)">opencode · gpt-5.6-sol</text>
        <text x="694" y="255" font-family="ui-monospace, Menlo, Consolas, monospace"
              font-size="10.5" fill="var(--ghost)">auditoría obligatoria por regla</text>
        <text x="694" y="272" font-family="ui-monospace, Menlo, Consolas, monospace"
              font-size="10.5" fill="var(--ghost)">nunca corrió</text>

        <!-- fallback -->
        <rect x="712" y="300" width="238" height="46" rx="3" fill="none"
              stroke="var(--ghost)" stroke-width="1.25" stroke-dasharray="5 4"/>
        <line x1="760" y1="282" x2="760" y2="298" stroke="var(--ghost)"
              stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#ag)"/>
        <text x="726" y="319" font-family="system-ui, sans-serif" font-size="12"

        <text x="726" y="336" font-family="ui-monospace, Menlo, Consolas, monospace"
              font-size="9.5" fill="var(--ghost)">reserva por cuota · nunca corrió</text>

        <!-- via humana -->
        <rect x="680" y="372" width="270" height="88" rx="3" fill="none"
              stroke="var(--warn)" stroke-width="1.6"/>
        <text x="694" y="398" font-family="system-ui, sans-serif" font-size="13.5"
              fill="var(--warn)">vos</text>
        <text x="694" y="417" font-family="ui-monospace, Menlo, Consolas, monospace"
              font-size="10.5" fill="var(--warn)" opacity="0.9">1 paquete · human-0001 · cerrado</text>
        <text x="694" y="437" font-family="ui-monospace, Menlo, Consolas, monospace"
              font-size="10.5" fill="var(--warn)" opacity="0.75">encontró 2 defectos de la instrucción</text>

        <!-- rail -->
        <g stroke="currentColor" stroke-width="1.25" opacity="0.7">
          <line x1="950" y1="112" x2="1000" y2="112"/>

        <rect x="20" y="486" width="1040" height="58" rx="3" fill="none"

        <text x="1036" y="520" text-anchor="end"

              font-size="10.5" fill="var(--ghost)">todavía no se usó como canal de contexto de un paquete</text>

        <rect x="20" y="560" width="1040" height="46" rx="3" fill="none"
              stroke="currentColor" stroke-width="1.25"/>
        <text x="44" y="580" font-family="ui-monospace, Menlo, Consolas, monospace"
              font-size="11" letter-spacing="0.1em" fill="currentColor" opacity="0.6">DISCO</text>

              font-size="10.5" fill="currentColor" opacity="0.8">.lucind/ — el ledger vive acá, no en engram · approvals.md · packets/ · results/</text>
      </svg>
      <figcaption>Cuatro vías diseñadas, dos ejercitadas. La que más aprendió fue la humana:
        un solo paquete reveló dos defectos de la instrucción que ninguna deliberación previa
        había encontrado. La auditoría con <span class="m">opencode</span> es obligatoria por
        regla desde hoy y nunca se ejecutó, así que la primera vez que corra va a ser con algo
        real. El ledger sigue en disco: engram guarda las decisiones y <span class="m">agy</span>
        ya demostró poder leerlo, pero ningún paquete lo usó todavía como canal de contexto. Y
        el orquestador acumula cinco roles — el patrón supervisor advierte exactamente sobre
        eso.</figcaption>
    </figure>

</div>
