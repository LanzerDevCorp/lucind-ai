  apply:
    status: done
    note: |
      Implemented via real lucind-ai run dispatch to agy, single packet (not DAG-split --
      tasks.md's own forecast called for one PR / three work-unit commits, and Phase 3.3 has
      a real ordering dependency on Phase 5's production signature change that a concurrent
      multi-lane split would have broken). All 8 phases complete, all tasks.md boxes checked,
      3 conventional commits (4aaf2b9 dag, b4623d3 worktree, a4556eb run+cli), full
      `go test ./... -race -count=1` green.

      Real dispatch bug hit and fixed live, first full run of this project's own runtime
      (read-only dispatch, apply-dag split/waves, verify two-stage, envelope persistence) in
      real development rather than self-verification: the apply packet's `allowed_paths` did
      not include `openspec/changes/apply-dag-dispatch-hardening/tasks.md`, even though the
      packet's own Done Criteria instructed the agent to check off tasks.md boxes as it went.
      The binary's allowed-paths-enforcement scope check -- the very capability this change
      hardens -- correctly caught the out-of-scope touch and demoted the lane from `done` to
      `deviated`; Integrate never ran (attempted=false), worktree preserved, nothing merged
      automatically. Verified in the preserved worktree before any recovery: build clean, full
      suite green with -race, all 3 commits present with no AI-attribution trailer, and the
      lane's own self-reported envelope already said `status: done` with zero deviations/
      findings/fired hard stops -- confirming the demotion was purely the missing
      `allowed_paths` entry, not a defect in the actual code or tests. Manually fast-forward
      merged the lane branch into main (`git merge --ff-only`, clean linear history, no
      conflicts) rather than redispatching and burning quota again for real, already-correct
      work; re-verified `go test ./... -race -count=1` green on main post-merge; cleaned up
      the lane worktree and branch. Lesson for future packet authoring: when a packet's Done
      Criteria or Goal instructs the agent to edit a doc/checklist file (e.g. checking off
      tasks.md boxes) as part of its work, that file's path MUST be included in the packet's
      own `allowed_paths` -- easy to omit when allowed_paths is scoped to "the code
      directories" and the doc edit is mentioned only in prose.
