change: sdd-fan-out-lens
created: 2026-08-21
artifact_store: hybrid
execution_mode: auto
delivery_strategy: single-pr
review_budget_lines: 5000
phases:
  explore:
    status: done
    engram_topic: sdd/sdd-fan-out-lens/explore
    drafts:
      - openspec/changes/sdd-fan-out-lens/explore-lens-a.md
      - openspec/changes/sdd-fan-out-lens/explore-lens-b.md
      - openspec/changes/sdd-fan-out-lens/explore-lens-c.md
    canonical: openspec/changes/sdd-fan-out-lens/explore.md
    note: |
      First phase run through the three-lens fan-out itself: three agy lenses write
      disjoint draft slices, cursor-agent synthesizes the canonical document. Exercised
      here on explore -- a cheap, non-durable artifact -- before betting the design
      phase on the same topology.

      Deviation from the archived explore precedent (single read_only cursor-agent lane):
      the lens lanes are WRITE packets. A read-only lane writes only .lucind/result.json,
      which is gitignored and per-worktree, so nothing integrates and the synthesis lane
      -- branched from main after wave 1 -- would find no drafts to read. Sibling
      worktrees cannot see each other; integration is the only channel between waves.

      Wave 1 done/done/done, integrated 3, reverted 0 (781/764/590 words, all under the
      800 cap). Wave 2 synthesis done, integrated 1, reverted 0: 962-word canonical
      explore.md, zero unresolved contradictions.

      Two findings from the pilot itself. (1) The citation-verification pass earned its
      keep: a mid-flight commit to SKILL.md (1a7fb9f) shifted line numbers after the lens
      lanes had branched, so every SKILL.md cite in lens A was stale by the time the
      synthesizer read it. The synthesizer caught and recast all nine ranges plus six more
      unrelated bad cites. OPERATIONAL RULE: do not commit to files the lenses cite while a
      fan-out is in flight. (2) The partition leaked on the sidecar-versus-hand-authored
      seam -- all three lenses covered it, harmlessly but redundantly. The synthesizer's
      proposed tightening is recorded in explore-synthesis-notes.md under Lens Overlap.
  proposal:
    status: done
    engram_topic: sdd/sdd-fan-out-lens/proposal
    drafts:
      - openspec/changes/sdd-fan-out-lens/proposal-lens-a.md
      - openspec/changes/sdd-fan-out-lens/proposal-lens-b.md
      - openspec/changes/sdd-fan-out-lens/proposal-lens-c.md
    canonical: openspec/changes/sdd-fan-out-lens/proposal.md
    note: |
      Chose Candidate 1 (null option: convention and template hardening, no Go).
      All three lenses independently declared Candidate 1 in their Assumed scope
      blocks with no access to each other -- recorded as independent convergence,
      not agreement by construction. Wave 1 done/done/done (675/777/656 words,
      cap 800), wave 2 synthesis 923 words. Synthesis dropped or recast ten
      citations and stripped eight altitude leaks (function names, argv, and
      file-change tables that belong to design). Zero unresolved contradictions.
  design:
    status: done
    engram_topic: sdd/sdd-fan-out-lens/design
    drafts:
      - openspec/changes/sdd-fan-out-lens/design-lens-a.md
      - openspec/changes/sdd-fan-out-lens/design-lens-b.md
      - openspec/changes/sdd-fan-out-lens/design-lens-c.md
    canonical: openspec/changes/sdd-fan-out-lens/design.md
    note: |
      The phase the three-lens fan-out was originally built for, and the first to run
      from the committed templates under assets/ rather than hand-authored packets.
      Design is a sibling of spec, not its successor -- both read only the proposal and
      both feed tasks -- so running spec first was orchestrator ordering, not a
      dependency. One benefit fell out of that ordering: spec lens C classified the four
      questions the proposal deferred to design, so design starts knowing which two are
      genuinely open (shared vs phase-specific template family; operator copy when a
      wave-1 lens fails) and which two the spec already bounded.

      Wave 1 done/done/done (962/921/891 words against a 1000 cap -- the tightest
      margins of the cycle, so the budget was binding rather than decorative). Wave 2
      canonical 1426 words, fifteen citations dropped, zero contradictions, all three
      assumed architectures converged on Candidate 1.

      Architecture Divergence did real work: three pieces of B and C content did not
      survive A's architecture. B wanted the four existing design templates marked
      Modify; A and C treat them as the pattern to copy and they already carry
      legacy_main: true, so the canonical leaves them alone. C added a test driving
      lucind-ai run admission rejection plus runDispatch/depsFactory seams; A confines
      new tests to internal/packet/packet_test.go. C also restated the two
      proposal-deferred questions as open, with recommendations matching A -- the
      synthesizer reclassified them as Decisions 1 and 2 rather than open questions.
  spec:
    status: done
    engram_topic: sdd/sdd-fan-out-lens/spec
    drafts:
      - openspec/changes/sdd-fan-out-lens/specs-lens-a/
      - openspec/changes/sdd-fan-out-lens/specs-lens-b/
      - openspec/changes/sdd-fan-out-lens/specs-lens-c/
    canonical: openspec/changes/sdd-fan-out-lens/specs/
    note: |
      Lens A owns the delta-or-none verdict, because the proposal records
      New/Modified Capabilities as None yet commits to contract tests that make the
      skill text and templates verifiable -- and a requirement a test enforces is what
      a specification exists to record. "No delta, and here is why" is an accepted
      outcome; the packet forbids manufacturing requirements to have something to write.

      FIRST REAL DIVERGENCE OF THE CYCLE, and the one that justifies the anchor.
      Lens A returned Delta under a new capability sdd-planning-fan-out with five ADDED
      requirements; lenses B and C both independently assumed "none -- no delta", reading
      the proposal's Capabilities: None literally. A's verdict is authoritative and was
      assembled; B/C divergence recorded. Without the anchor that disagreement would have
      entered the canonical document invisibly -- edge scenarios written for requirements
      their author believed did not exist, and a traceability matrix auditing coverage
      against an empty set.

      Canonical 835 words, five requirements, eleven scenarios. Nine of B's edge scenarios
      attached to A's requirements; two landed as orphans. The synthesizer diagnosed the
      orphans better than the packet anticipated: they are not a missed requirement but B
      correctly verifying that allowed-paths-enforcement and completion-mode-enforcement do
      not move, so the scenarios belong to those unchanged specs rather than to this delta.
      Zero unresolved contradictions. All six named specs confirmed unchanged, so no
      MODIFIED/REMOVED/RENAMED block.
  tasks:
    status: in-progress
    engram_topic: sdd/sdd-fan-out-lens/tasks
    drafts:
      - openspec/changes/sdd-fan-out-lens/tasks-lens-a.md
      - openspec/changes/sdd-fan-out-lens/tasks-lens-b.md
      - openspec/changes/sdd-fan-out-lens/tasks-lens-c.md
    canonical: openspec/changes/sdd-fan-out-lens/tasks.md
    note: |
      Lens B owns the path partition and DAG shape specifically so the downstream
      opencode lucind-dag agent has real boundaries to turn into apply-dag.yaml.
      The synthesizer re-verifies B's disjointness claim against the assembled task
      list rather than trusting it: two same-wave tasks touching one path make the
      whole dispatch reject upfront, and that is cheaper to catch here than at
      dispatch. Lens C owns the Review Workload Forecast, whose four guard lines must
      appear verbatim because a downstream guard matches them literally.
  apply:
    status: pending
  verify:
    status: pending
  archive:
    status: pending
notes: |
  Formalizes the three-lens SDD fan-out: three agy lenses per phase plus a cursor-agent
  synthesizer. The convention and its four design packet templates already exist on main
  (10c69d8, e8a67dd, 805167c); this change determines what, if anything, the binary itself
  must grow to support it. Session preflight: execution_mode=auto, artifact_store=hybrid,
  delivery_strategy=single-pr, review_budget_lines=5000.
