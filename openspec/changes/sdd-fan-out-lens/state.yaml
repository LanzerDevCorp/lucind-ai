notes: |
  Formalizes the three-lens SDD fan-out: three agy lenses per phase plus a cursor-agent
  synthesizer. The convention and its four design packet templates already exist on main
  (10c69d8, e8a67dd, 805167c); this change determines what, if anything, the binary itself
  must grow to support it. Session preflight: execution_mode=auto, artifact_store=hybrid,
  delivery_strategy=single-pr, review_budget_lines=5000.
