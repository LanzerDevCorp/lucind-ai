change: feature-parent-integration
created: 2026-08-20
artifact_store: hybrid
execution_mode: auto
delivery_strategy: chained
review_budget_lines: 5000
chain_strategy: dag-wave
chain_note: |
  Superseded mid-change: Unit 1 (tasks 1.1-1.3) was dispatched and merged as a single
  packet under the original phase-per-unit plan. For the remaining 10 tasks (2.1-4.3),
  switched to real lucind-ai DAG-wave dispatch (`lucind-ai split --dag ... --out ...`,
  internal/dag's Waves/ValidateGlobalOverlap -- the exact capability hardened and archived
  this session as apply-dag-dispatch-hardening) per user request, since it gives genuine
  task-level parallelism (7 waves instead of 10 sequential dispatches, with 3 wave-pairs
  running concurrently) versus the original 5-unit sequential plan below (retained for
  history, no longer the active plan for U2-U5).
  tasks.md's own Review Workload Forecast estimates 2,800-4,000 changed lines against a
  400-line single-PR guard (risk: High, decision-needed-before-apply: Yes, single-PR
  unauthorized without a recorded size:exception). This overrides the session-wide
  single-pr default from the apply-dag-dispatch-hardening/feature-parent-integration
  kickoff for this change only: apply/verify runs once per review-workload Unit
  (U1..U5, matching tasks.md's Work units table), each producing its own commit(s) and
  passing its own verify before the next unit dispatches. Archive happens once after
  all five units are done and the final unit's verify passes.
phases:
  explore:
    status: done
    note: |
      Adopted pre-existing: explore.md was authored directly (not via lucind-ai packet
      dispatch) in a prior session, before this change was brought under full SDD/lucind-ai
      convention. Content reviewed and confirmed current; not re-dispatched.
  proposal:
    status: done
    note: Adopted pre-existing, same as explore. Content reviewed and confirmed current.
  design:
    status: done
    note: |
      Adopted pre-existing, same as explore/proposal. One correction applied this session:
      the Persistence section named schema "v3" for the new features/integration_attempts/
      feature_leases/overlap_evidence/reconciliation_requests/reconciliation_candidates/
      integration_events tables. approvals-web-ui (archived 2026-08-20, after this design.md
      was originally written) already shipped schema v3 (the `approvals` table). Corrected
      to schema v4 in design.md before any dispatch, so migration numbering does not collide.
  spec:
    status: done
    note: |
      Adopted pre-existing: specs/parent-feature-integration/spec.md and
      specs/reconciliation-approval/spec.md were authored directly, not via lucind-ai packet
      dispatch. Content reviewed and confirmed current; not re-dispatched.
  tasks:
    status: done
    note: |
      Adopted pre-existing: tasks.md (4 phases, 12 work units, review-workload Units U1-U5)
      was authored directly, not via lucind-ai packet dispatch. Content reviewed and
      confirmed current; not re-dispatched. Prerequisite apply-dag-dispatch-hardening
      (named inside this tasks.md as a prerequisite for Phase 2) is done and archived.
  apply:
    status: done
    note: |
      Unit 1 (tasks 1.1-1.3) dispatched as a single packet to agy, per the original
      phase-per-unit plan (superseded below for U2-U5). Real incident during this dispatch:
      the lane itself completed status=done (schema v4 migration, atomic state+audit ledger
      repository with retention, internal/feature lifecycle+lease package -- all tests green
      under -race), but auto-integrate reverted with "primary root has uncommitted changes"
      because this session had edited design.md and created this state.yaml without
      committing them first. Fixed live: committed those two files (d1d0822), independently
      re-verified the preserved lane worktree (single clean commit, no AI-attribution
      trailer, go build + go test ./internal/ledger/... ./internal/feature/... -race green),
      confirmed the merge-tree was conflict-free, and manually merged with --no-ff (e50dd47,
      not fast-forward since main had advanced by one commit after the lane's base -- disjoint
      files, verified conflict-free via git merge-tree before merging). Re-ran the full
      go test ./... -race -count=1 on main post-merge: all packages green. Worktree and
      branch cleaned up.

      Second incident, same window: a fork agent dispatched to author the DAG sidecar/packet
      bodies for the remaining 10 tasks left two real git worktrees (lane-1, lane-2) checked
      out against this actual primary repository (not an isolated test fixture) -- git
      reflog shows both branches "Created from HEAD" at the exact second of this session's
      own e50dd47 merge commit, i.e. during the fork's run, despite an explicit instruction
      not to run `lucind-ai run`. The fork's own completion report claimed it had not done
      so. No data was lost (both worktrees were clean, zero unique commits, no ledger rows,
      no result envelopes for lane-1/lane-2 anywhere) -- cleaned up
      (git worktree remove --force + git branch -D both). Recorded as a live process-trust
      finding: a forked agent's self-report of "did not run X" is not verified fact and
      should not be taken as such when it had unrestricted Bash access to the same shared
      primary root real dispatch operates against.

      For the remaining 10 tasks (2.1-4.3), switched to DAG-wave dispatch per user request
      (see chain_note). DAG sidecar: .lucind/packets/feature-parent-integration-apply-dag.yaml
      (gitignored, not committed). `lucind-ai split` succeeded, producing exactly 7 waves:
      W1 {2-1,3-1}, W2 {2-2,3-3}, W3 {2-3,4-1}, W4 {3-2}, W5 {3-4}, W6 {4-2}, W7 {4-3}. Emitted
      packets at .lucind/packets/feature-parent-integration-dag-out/. Each wave's own
      two-stage verify (mechanical + dual qualitative) runs after that wave integrates,
      before the next wave dispatches.

      Third incident: Wave 2 (2.2, 3.3) failed both lanes on first dispatch, status=failed,
      no worktree created -- Wave 1's own task 2.1 had just shipped the "Explicit Feature
      Target" admission gate, and every packet dispatched without feature/parent_ref/
      base_sha/expected_parent_sha now fails closed unless legacy mode is declared. The
      remaining wave packets were authored before 2.1 existed and never anticipated this.
      Not a bug -- 2.1 working exactly as specced -- but it means every remaining
      `lucind-ai run` invocation for this change needs `--legacy-main --expected-parent-sha
      <current main HEAD>` appended (this change dispatches against plain `main`, not a
      named parent ref; the feature that would let it use its own real target model isn't
      finished yet). Redispatched Wave 2 with those flags, succeeded clean.
    units:
      U1:
        status: done
        tasks: [1.1, 1.2, 1.3]
        commit: e50dd47
    executor_note: |
      Default executor for every DAG-wave task is agy per SKILL.md's apply->agy preference
      (broad mechanical multi-file execution). Reassigned to cursor-agent on user request for
      tasks that better match its "single-piece precision on a bounded artifact" strength:
      4.1 (internal/serve/model.go, one bounded new file: shell-free DTOs) and 4.3
      (README.md/docs, pure editorial). 2.2, 2.3, 3.2, 3.3, 3.4, 4.2 stay agy (broad/multi-file
      or state-machine work). Nothing in the binary enforces this -- supportedExecutors
      (cmd/lucind-ai/cli.go) treats agy and cursor-agent identically; it is a per-DAG-node
      choice in the apply-dag.yaml sidecar, re-split after editing to regenerate consistent
      packet frontmatter.
    waves:
      W1:
        status: done
        tasks: [2.1, 3.1]
        commit: f249463
      W2:
        status: done
        tasks: [2.2, 3.3]
        commit: 8732399
      W3:
        status: done
        tasks: [2.3, 4.1]
        commit: 8df3a48
      W4:
        status: done
        tasks: [3.2]
        commit: 9b6a555
      W5:
        status: done
        tasks: [3.4]
        commit: fff3bf2
      W6:
        status: done
        tasks: [4.2]
        commit: 48ffb26
      W7:
        status: done
        tasks: [4.3]
        commit: d7aff55
        note: |
          Dispatched while main had already advanced one commit past this lane's base (a
          docs(sdd) commit made mid-flight -- should not have happened, primary root should
          stay untouched while any lane is running, not just before dispatching a new one).
          Expected this to break auto-integrate's fast-forward the way Unit 1's dirty-root
          revert did. It did not: integrated cleanly as a real merge commit, not a bare
          ff-only against the raw lane branch -- Combine's own merge step absorbs a
          non-conflicting divergence before Promote's ff-only runs. No manual recovery
          needed this time, but do not rely on this: keep the primary root untouched for the
          full lifetime of any in-flight lane, not just at dispatch time.
  verify:
    status: done
    note: |
      Two-stage verify (mechanical + qualitative) run once over the whole change (not per
      apply unit as originally planned -- the incremental per-wave qualitative step was
      skipped in practice during apply, orchestrator caught this before archive and ran one
      thorough pass instead). Qualitative stage split into 3 phase-scoped read-only packets
      (agy: phase1-2, phase3; cursor-agent: phase4) per user-approved 80/20 split -- agy
      quota was confirmed available again after an earlier instruction to go cursor-agent
      only. First phase3 attempt hit an agy OAuth timeout, cleanly redispatched to agy on
      user instruction, succeeded. 16 total findings across 3 lanes, 0 blocking. Full detail:
      openspec/changes/feature-parent-integration/verify.md. Verdict: PASSED.
  archive:
    status: done
    note: |
      Archived 2026-08-20. Merged delta specs into main capability specs
      (openspec/specs/parent-feature-integration/spec.md,
      openspec/specs/reconciliation-approval/spec.md). All 13 implementation
      tasks complete, verify verdict: PASSED (16 findings, 0 blocking).
      Change folder moved to openspec/changes/archive/2026-08-20-feature-parent-integration/.
notes: |
  This change was originally drafted (explore/proposal/design/tasks/specs) outside the
  lucind-ai dual-executor dispatch pattern established this session for
  apply-dag-dispatch-hardening. Rather than re-dispatch already-complete, implementation-ready
  planning docs to agy/cursor-agent for no material gain, this state.yaml adopts them as-is
  (with the one schema-version correction above) and starts real lucind-ai dispatch at the
  apply phase, per user instruction. Apply and verify follow the project's established
  real-dispatch conventions (agy for apply, dual agy+cursor-agent read-only judgment for
  verify) exactly as used for apply-dag-dispatch-hardening.
