    status: done
    note: |
      Authored SDD proposal formalizing ultrafixer capability: ephemeral agy-lane dispatch,
      base_sha origin classification, independent two-axis critical and per-branch blocking
      evaluation across active features, signal-reproduced cross-branch impact detection,
