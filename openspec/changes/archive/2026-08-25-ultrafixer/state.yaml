  From proposal onward, every phase (propose, spec, design, tasks, apply, verify, archive) is
  dispatched as a real lucind-ai Lane (executor agy, one bounded packet per phase — this Change
  uses SDD simple/no-fan-out, so no lens/synthesis packets) targeting this feature, per the
  user's explicit instruction and per plugin/claude-code/skills/lucind-ai/references/strategies/
  sdd.md's own documented phase routes. Each packet's base_sha/expected_parent_sha is refreshed to
  the feature branch's actual current tip before dispatch (per recovery-reconciliation.md's
  multi-wave sequencing rule) rather than reusing the immutable feature-create base_sha.

  Design for ultrafixer itself was fully grilled and confirmed with the human before this
  scaffolding began (see the conversation's grilling transcript / the confirmed design summary
  carried into the propose packet's Context section) — sdd-propose's job is to formalize and
  ground that already-agreed design, not to re-derive or re-litigate it.
