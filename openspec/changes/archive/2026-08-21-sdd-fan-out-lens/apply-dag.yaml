# DO NOT DISPATCH. This sidecar is a record, not a plan.
#
# It is a faithful transcription of tasks.md -- four nodes, a RED root and three
# GREEN dependants, individually named paths, correct executors -- and
# `lucind-ai split` parses it and emits the two expected wave commands. It was
# never run, and running it now would fail.
#
# Reason: Integrate gates every batch on lucind-checks.sh
# (internal/run/integrate.go:50-59), so wave 1 -- whose accepted done criterion
