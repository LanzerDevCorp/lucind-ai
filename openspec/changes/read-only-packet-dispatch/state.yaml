change: read-only-packet-dispatch
created: 2026-08-19
artifact_store: hybrid
execution_mode: auto
delivery_strategy: single-pr
review_budget_lines: 2000
phases:
  explore:
    status: done
    note: |
      Inherited from the umbrella exploration covering all three dual-executor-dispatch
      directions (engram sdd/dual-executor-dispatch/explore). This change is the "small,
      prerequisite" direction (read-only packet dispatch, unblocks explore-phase dispatch and
      is a hard prerequisite for the future verify-dual-dispatch change).
    engram_topic: sdd/dual-executor-dispatch/explore
  proposal:
    status: done
    engram_topic: sdd/read-only-packet-dispatch/proposal
    drafts:
      - openspec/changes/read-only-packet-dispatch/proposal-agy.md
      - openspec/changes/read-only-packet-dispatch/proposal-cursor-agent.md
    canonical: openspec/changes/read-only-packet-dispatch/proposal.md
    note: |
      Dispatched via real lucind-ai run (agy + cursor-agent packets), not a Claude Code
      subagent -- first real use of the "explore via real dispatch" pattern's sibling,
      propose/design dual-dispatch, which is already verified working (approvals-web-ui
      session 3). Both lanes done, merged to main cleanly. Drafts converged heavily; canonical
      merges agy's Affected-Areas/Success-Criteria tables with cursor-agent's tighter
      current-behavior evidence table and its sharper open-question #4 (whether write packets
      gain a code-level commit gate).
  design:
    status: done
    engram_topic: sdd/read-only-packet-dispatch/design
    drafts:
      - openspec/changes/read-only-packet-dispatch/design-agy.md
      - openspec/changes/read-only-packet-dispatch/design-cursor-agent.md
    canonical: openspec/changes/read-only-packet-dispatch/design.md
    note: |
      Dispatched in parallel with proposal, not waiting on it -- explicit session decision,
      consistent with the approvals-web-ui precedent that propose and design are not
      dependent phases in this project's workflow. Both lanes done, merged to main cleanly.
      Both drafts converged on the same core architecture (read_only bool, runtime
      enforcement) but diverged on WHERE/HOW: agy trusts the self-reported envelope
      (Envelope.Commit/FilesChanged) inline in decideStatus; cursor-agent inspects git
      directly via new Deps functions in a separate enforceCompletionMode step, and rejects
      trusting self-reported fields as the same class of bug the project exists to catch.
      Canonical design adopts cursor-agent's architecture for that reason; agy's proposed
      integrate.go branch-filtering is rejected as an unnecessary optimization (already a
      correct no-op).
  spec:
    status: done
    engram_topic: sdd/read-only-packet-dispatch/spec
    drafts:
      - openspec/changes/read-only-packet-dispatch/specs-agy/
      - openspec/changes/read-only-packet-dispatch/specs-cursor-agent/
    canonical: openspec/changes/read-only-packet-dispatch/specs/
    note: |
      Dispatched via real lucind-ai run (agy + cursor-agent), both lanes done. cursor-agent's
      commit carried the known Co-authored-by trailer bug (git commit-tree rewrite before
      merge, same fix as prior session). Both drafts converged heavily, no contradictions
      (unlike design) -- 3 canonical capability specs synthesized: read-only-packet-schema,
      read-only-done-criterion, completion-mode-enforcement.
  tasks:
    status: done
    engram_topic: sdd/read-only-packet-dispatch/tasks
    drafts:
      - openspec/changes/read-only-packet-dispatch/tasks-agy.md
      - openspec/changes/read-only-packet-dispatch/tasks-cursor-agent.md
    canonical: openspec/changes/read-only-packet-dispatch/tasks.md
    note: |
      Dispatched via real lucind-ai run (agy + cursor-agent), both lanes done. cursor-agent's
      commit had the known Co-authored-by trailer, stripped via commit-tree rewrite before
      merge. cursor-agent's draft was more precise (named test functions, exact RED/GREEN
      scenarios, explicit sequencing notes and constraints) and was adopted near-verbatim as
      canonical. Review-budget forecast: 900-1300 lines, well under the 2000-line budget --
      no chained-PR decision needed for this change.
  apply:
    status: done
    note: |
      Implemented via real lucind-ai run dispatch to agy/cursor-agent, hand-split into 4 waves
      since the binary's own DAG-splitter (apply-dag-dispatch) doesn't exist as code yet --
      Wave A: Unit 1 (packet.go, agy) + Unit 2 (worktree.go, cursor-agent), no file overlap,
      both done, auto-integrated cleanly (commits 0bf3565, ed8e805). Wave B: Unit 3 (run.go,
      agy) + Unit 5 (result/assets/SKILL.md docs, cursor-agent), no file overlap, both done;
      Unit 5's own generated test (TestSkillAssetContract) asserted on a SKILL.md section that
      was concurrently trimmed mid-flight (unrelated user-requested edit moving binary-freshness
      guidance to the new project CLAUDE.md) -- auto-integrate correctly bisected and reverted
      Unit 5, fixed by dropping the one stale assertion and re-merging by hand (commits 19be89a,
      22cc104, 553c384). Wave C: Unit 4 (cli.go wiring, agy solo) -- first attempt hit a
      transient agy CLI network timeout (eligibility check dial timeout, same class of flake
      seen earlier this session), cleaned stale worktree/branch and redispatched successfully
      (commit e89b30b). Unit 6 (end-to-end): orchestrator dispatched a real read_only:true
      packet directly (not via a change-authoring packet); reached lane.Done, integrate
      succeeded with 0 reverted, and the lane's worktree/branch were auto-cleaned by the
      binary's own successful-combine path -- only possible if enforceCompletionMode accepted
      the lane as a compliant read-only lane (no unique commits, clean tree). Full `go test
      ./... -race -count=1` green throughout. Also fixed en route (not scoped to this change but
      touching the binary along the way): added `lucind-ai --version`/`-v` (commit 440ef53,
      `make install` target) after discovering the stale $GOPATH/bin binary that caused earlier
      "unsupported executor" errors this session.
  verify:
    status: done
    engram_topic: sdd/read-only-packet-dispatch/verify
    canonical: openspec/changes/read-only-packet-dispatch/verify.md
    note: |
      First real end-to-end use of the now-fully-built verify-dual-dispatch mechanism (Stage 1
      mechanical check + Stage 2 dual read-only judgment dispatch), run against this change as
      the candidate. Stage 1: lucind-ai check passed clean (commit cce1c97, log committed as
      verify-mechanical.log). Stage 2: two read_only:true packets dispatched to agy and
      cursor-agent in parallel, both returned done, both PASS with no blocking findings, both
      integrated cleanly with zero reverted. Overall verdict PASSED.
      Real gap discovered during Stage 3 reconciliation: Integrate removes a lane's worktree as
      soon as it's folded into integrated_ids (internal/run/integrate.go:158), including
      read_only lanes with nothing to merge, and lucind-ai run's stdout only ever prints
      Envelope.Summary (cmd/lucind-ai/cli.go:409-414) -- never the structured Envelope.Findings.
      The ledger persists only status transitions, not the envelope body. So this reconciliation
      relied on each lane's free-text summary, not independently re-verified file:line citations
      as design.md's Stage 3 describes -- not something either sibling change's own design
      anticipated. Both summaries were specific enough and mutually consistent to support PASSED
      here, but the underlying gap (persist the full envelope before worktree removal, e.g. copy
      .lucind/result.json into the primary root or store it in the ledger) is unresolved and
      should be fixed before this reconciliation step is relied on for a disputed or
      higher-risk verification. User explicitly chose to synthesize with available evidence now
      and treat the fix as a future follow-up, not a blocker for this verify pass.
  archive:
    status: pending
notes: |
  One of three sibling changes split from a single umbrella exploration
  (sdd/dual-executor-dispatch/explore): read-only-packet-dispatch (this one, small),
  apply-dag-dispatch (large, independent), verify-dual-dispatch (small, depends on this one).
  Planning-only session per explicit user instruction -- no apply phase until the user asks.
  Dual-executor SDD phase experiment: propose/design phases author their content via lucind-ai
  packets dispatched to agy AND cursor-agent in parallel, per
  plugin/claude-code/skills/lucind-ai/SKILL.md's routing preference table. The orchestrator
  (this Claude Code session) synthesizes/selects from parallel outputs and owns the canonical
  artifact in openspec/ + engram.
