change: verify-dual-dispatch
created: 2026-08-20
artifact_store: hybrid
execution_mode: auto
delivery_strategy: single-pr
review_budget_lines: 2000
phases:
  explore:
    status: done
    note: |
      Inherited from the umbrella exploration covering all three dual-executor-dispatch
      directions (engram sdd/dual-executor-dispatch/explore). This change is the "small,
      dependent" direction (verify-phase dual dispatch for the qualitative half only). Depends
      on read-only-packet-dispatch's design (Packet.ReadOnly, enforceCompletionMode) being
      final, since verify's judgment packets are read-only lanes by construction -- that
      dependency is now satisfied (read-only-packet-dispatch design/spec/tasks all done).
    engram_topic: sdd/dual-executor-dispatch/explore
  proposal:
    status: done
    engram_topic: sdd/verify-dual-dispatch/proposal
    drafts:
      - openspec/changes/verify-dual-dispatch/proposal-agy.md
      - openspec/changes/verify-dual-dispatch/proposal-cursor-agent.md
    canonical: openspec/changes/verify-dual-dispatch/proposal.md
    note: |
      Dispatched via real lucind-ai run (agy + cursor-agent packets), in parallel with design
      (not sequentially -- same explicit session decision as the other two sibling changes).
      Both lanes done; cursor-agent's commit carried the known Co-authored-by trailer, stripped
      via commit-tree rewrite before merge. Both packets independently used the same allowed
      path (openspec/changes/verify-dual-dispatch/proposal.md) -- an authoring mistake this
      session (should have used distinct proposal-agy.md/proposal-cursor-agent.md allowed paths
      like every prior phase) -- recovered post-merge by aborting the conflicted second merge,
      renaming each branch's file to its draft name (proposal-agy.md / proposal-cursor-agent.md)
      before merging the other, with no content loss. Drafts converged heavily (unlike
      apply-dag-dispatch's design pair): canonical adopts cursor-agent's sharper
      current-behavior-vs-target-behavior evidence table and open-questions structure, merged
      with agy's Affected-Areas/Risks table framing -- same split this project used for
      read-only-packet-dispatch's canonical proposal.
  design:
    status: done
    engram_topic: sdd/verify-dual-dispatch/design
    drafts:
      - openspec/changes/verify-dual-dispatch/design-agy.md
      - openspec/changes/verify-dual-dispatch/design-cursor-agent.md
    canonical: openspec/changes/verify-dual-dispatch/design.md
    note: |
      Dispatched in parallel with proposal, not waiting on it. Same same-allowed-path authoring
      mistake and same recovery as proposal (renamed to design-agy.md / design-cursor-agent.md
      post-merge, no content loss). Both lanes done, cursor-agent's Co-authored-by trailer
      stripped via commit-tree rewrite before merge. Both drafts converged strongly on all 5
      decisions -- no real technical bug caught between them this time (unlike
      apply-dag-dispatch's HEAD~1 bug). Canonical synthesis: adopted cursor-agent's more
      concrete/actionable treatment of mechanical-rerun prohibition (Decision 3, explicit hard
      stop wording + rejected chmod/delete alternatives) and its explicit "no new
      result.schema.json fields" stance (Decision 2); adopted agy's verify.md canonical-report
      naming (matches this project's existing proposal.md/design.md/tasks.md convention) over
      cursor-agent's verify-report.md; merged cursor-agent's explicit human-escalation-on-genuine-
      ambiguity step into agy's 3-case reconciliation table (Decision 4); adopted cursor-agent's
      verify-mechanical.log naming and richer captured-field set (command line, exit code,
      duration, git SHA) over agy's verify-mechanical.txt. New CLI subcommand `lucind-ai check`
      wrapping the existing internal/integrate.Check -- both drafts agreed independently.
  spec:
    status: done
    engram_topic: sdd/verify-dual-dispatch/spec
    drafts:
      - openspec/changes/verify-dual-dispatch/specs-agy/
      - openspec/changes/verify-dual-dispatch/specs-cursor-agent/
    canonical: openspec/changes/verify-dual-dispatch/specs/
    note: |
      Dispatched via real lucind-ai run (agy + cursor-agent), both lanes done, no allowed_paths
      collision this time (each packet targeted its own specs-<executor>/ directory, unlike the
      proposal/design phases' authoring mistake). cursor-agent's commit carried the known
      Co-authored-by trailer, stripped via commit-tree rewrite before merge. Both merged to main
      cleanly, no conflicts. agy split into 4 capability files (mechanical-check-cli,
      verify-judgment-packet, mechanical-rerun-prohibition, verdict-reconciliation);
      cursor-agent split into 3 (verify-mechanical-check, verify-judgment-packet,
      verify-dual-dispatch). Canonical follows cursor-agent's 3-file split (consistent with the
      convention already used for read-only-packet-dispatch and apply-dag-dispatch's canonical
      specs), but folds in agy's finer-grained requirement breakdown of verdict reconciliation
      (separate Unanimous/Disagreement/Lane-Failure/Ambiguity-Escalation requirements instead of
      cursor-agent's single "Four-Case" requirement) and agy's explicit "Terminal Consumers of
      the Mechanical Log Artifact" and "Read-Only Tool Selection Guidance" requirements, which
      cursor-agent's drafts covered only implicitly inside other requirements. No contradictions
      between drafts -- pure convergence, unlike design's naming/detail differences.
  tasks:
    status: done
    engram_topic: sdd/verify-dual-dispatch/tasks
    drafts:
      - openspec/changes/verify-dual-dispatch/tasks-agy.md
      - openspec/changes/verify-dual-dispatch/tasks-cursor-agent.md
    canonical: openspec/changes/verify-dual-dispatch/tasks.md
    note: |
      Dispatched via real lucind-ai run (agy + cursor-agent), both lanes done, distinct allowed
      paths this time (tasks-agy.md / tasks-cursor-agent.md), no collision. cursor-agent's commit
      carried the known Co-authored-by trailer, stripped via commit-tree rewrite before merge.
      Both merged to main cleanly. cursor-agent's draft was more precise (exact test bodies with
      concrete assertion strings, formatMechanicalLog split into its own testable unit) and was
      adopted near-verbatim as canonical, same pattern as both sibling changes' tasks phase.
      Review-budget forecast: 740-1090 lines (cursor-agent) / 500-750 lines (agy) -- both
      independently confirm this is the smallest of the three sibling changes by a wide margin,
      comfortably under the 2000-line budget, single-pr delivery strategy unchanged, no chained-
      PR decision needed (unlike apply-dag-dispatch's corroborated over-budget forecast).

      Mid-session process fix: discovered (user-flagged) that all packet dispatch files this
      session had been authored at the primary repo root instead of the gitignored
      .lucind/packets/ -- the actual cause of the recurring "primary root has uncommitted
      changes" integrate failure on every single batch this session, not an inherent binary
      limitation. Documented in plugin/claude-code/skills/lucind-ai/SKILL.md (commit 6289684,
      new "Where to author packet files" section) so future sessions don't repeat it. This
      change's own packets (propose/design/specs) were still authored at the root before the fix
      landed; only this tasks-phase dispatch and any future ones should use .lucind/packets/.
  apply:
    status: pending
  verify:
    status: pending
  archive:
    status: pending
notes: |
  One of three sibling changes split from a single umbrella exploration
  (sdd/dual-executor-dispatch/explore): read-only-packet-dispatch (small, done through tasks),
  apply-dag-dispatch (large, independent, done through tasks), verify-dual-dispatch (this one,
  small, depends on read-only-packet-dispatch). Planning-only session per explicit user
  instruction -- no apply phase until the user asks.
  Dual-executor SDD phase experiment: propose/design phases author their content via lucind-ai
  packets dispatched to agy AND cursor-agent in parallel, per
  plugin/claude-code/skills/lucind-ai/SKILL.md's routing preference table. The orchestrator
  (this Claude Code session) synthesizes/selects from parallel outputs and owns the canonical
  artifact in openspec/ + engram.
