  tasks:
    status: done
    engram_topic: sdd/apply-dag-dispatch/tasks
    drafts:
      - openspec/changes/apply-dag-dispatch/tasks-agy.md
      - openspec/changes/apply-dag-dispatch/tasks-cursor-agent.md
    canonical: openspec/changes/apply-dag-dispatch/tasks.md
    note: |
      Dispatched via real lucind-ai run (agy + cursor-agent), both lanes done. cursor-agent's
      commit had the known Co-authored-by trailer, stripped via commit-tree rewrite before
      merge. cursor-agent's draft was far more precise (per-scenario RED/GREEN, already
