schema: spec-driven

artifact_store:
  mode: hybrid
execution_mode: auto
delivery_strategy: single-pr
review_budget_lines: 3000
strict_tdd: true

context: |
  Tech stack: Go 1.25.0, module github.com/LanzerDevCorp/lucind-ai, SQLite (modernc.org/sqlite).
  Architecture: cmd/lucind-ai CLI orchestrates isolated git worktrees and internal services;
    internal/ledger persists lane/run/event state, with barrier/reconciliation/integration packages.
  Testing: Go stdlib testing; table-driven and scenario tests, t.TempDir real-SQLite fixtures,
    fake executor seams, and testdata fixtures. No dedicated E2E runner or coverage gate detected.
  Quality: lucind-checks.sh runs CGO_ENABLED=0 go build ./... then go test ./... -race -count=1.
  Pre-existing working-tree changes are unvalidated scaffolding, not SDD artifacts, until inspected.

testing:
  runner: "go test ./... -race -count=1"
  framework: "Go standard testing"
  unit: true
  integration: true
  e2e: false
  coverage_command: "go test ./... -cover"
  coverage_threshold: 0
  linter: "not detected"
  typecheck: "go build ./..."
  formatter: "gofmt"

rules:
  proposal:
    - Include rollback plan for risky changes
    - State explicitly which existing lane-lifecycle call site the change hooks into
    - Inspect pre-existing working-tree changes before treating them as valid SDD artifacts
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Name the exact schema migration (version, table/columns) and the exact call sites touched
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (see internal/ledger, internal/run test conventions)
    tdd: true
    test_command: "go test ./... -race -count=1"
  verify:
    test_command: "go test ./... -race -count=1"
    build_command: "go build ./..."
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
